name: Sandbox staking API tests

on:
  push:
    branches:
      - sandbox/blockchain-api-tests
    paths:
      - "staking.py"
      - "tests/test_staking_api.py"
      - ".github/workflows/sandbox-staking-tests.yml"
  pull_request:
    branches:
      - sandbox/blockchain-api-tests
    paths:
      - "staking.py"
      - "tests/test_staking_api.py"
      - ".github/workflows/sandbox-staking-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out sandbox branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip Flask pytest
      - name: Run staking API tests
        run: python -m pytest -q tests/test_staking_api.py
